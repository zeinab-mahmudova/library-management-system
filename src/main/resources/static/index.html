<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitabxana İdarəetmə Sistemi</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="password"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #2980b9; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .card { background: #fafbfc; padding: 20px; border: 1px solid #e1e4e6; border-radius: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #34495e; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .token-box { background: #e8f4fd; padding: 10px; border-radius: 5px; border-left: 5px solid #3498db; word-break: break-all; font-family: monospace; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 Kitabxana İdarəetmə Sistemi (Frontend İnterfeys)</h1>

    <div class="grid">
        <div class="card">
            <h2>🔐 İstifadəçi Girişi (JWT Auth)</h2>
            <div class="form-group">
                <label>İstifadəçi adı:</label>
                <input type="text" id="username" value="admin">
            </div>
            <div class="form-group">
                <label>Şifrə:</label>
                <input type="password" id="password" value="password123">
            </div>
            <button onclick="login()">Sistemə Giriş Et</button>
            <div id="authStatus" style="margin-top: 10px; font-weight: bold;"></div>
        </div>

        <div class="card">
            <h2>🔍 İntellektual Kitab Axtarış Sistemi</h2>

            <div class="form-group">
                <label>Kitab adı:</label>
                <input type="text" id="searchTitle" placeholder="Məsələn: Xəmsə">
            </div>
            <div class="form-group">
                <label>Müəllif adı:</label>
                <input type="text" id="searchAuthor" placeholder="Məsələn: Nizami">
            </div>
            <button onclick="searchBooks()">İntellektual Axtarış</button>
        </div>
    </div>

    <div>
        <h2>📖 Sistemdəki Mövcud Kitablar (REST API-dən Gələn)</h2>
        <button onclick="loadBooks()" style="background-color: #2ecc71;">Siyahını Yenilə</button>
        <table id="booksTable">
            <thead>
            <tr>
                <th>ID</th>
                <th>Kitab Adı</th>
                <th>ISBN</th>
                <th>Qiymət</th>
                <th>Endirim</th>
                <th>Müəllif</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td colspan="6" style="text-align: center; color: #7f8c8d;">Siyahını yükləmək üçün yuxarıdakı düyməyə basın.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    let accessToken = "";
    let refreshToken = "";

    async function login() {
        const u = document.getElementById("username").value;
        const p = document.getElementById("password").value;
        const status = document.getElementById("authStatus");

        try {
            const response = await fetch('/api/v1/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            });

            if (response.ok) {
                const data = await response.json();
                accessToken = data.accessToken;
                refreshToken = data.refreshToken;
                status.style.color = "#2ecc71";
                status.innerHTML = `✅ Giriş uğurludur!<br><div class="token-box"><strong>Access Token:</strong> ${accessToken.substring(0, 30)}...</div>`;
                loadBooks();
            } else {
                status.style.color = "#e74c3c";
                status.innerText = "❌ Giriş uğursuz oldu! Məlumatları yoxlayın.";
            }
        } catch (error) {
            status.style.color = "#e74c3c";
            status.innerText = "❌ Backend-ə bağlanmaq mümkün olmadı! (Tətbiqi işə salın)";
        }
    }

    async function loadBooks() {
        const tbody = document.querySelector("#booksTable tbody");
        try {
            const response = await fetch('/api/v1/books?page=0&size=10', {
                headers: { 'Authorization': accessToken ? 'Bearer ' + accessToken : '' }
            });
            if (response.ok) {
                const data = await response.json();
                tbody.innerHTML = "";
                if(data.content.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">Bazada kitab tapılmadı.</td></tr>`;
                    return;
                }
                data.content.forEach(book => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${book.id}</td>
                            <td><strong>${book.title}</strong></td>
                            <td>${book.isbn}</td>
                            <td>${book.price || '0.00'} AZN</td>
                            <td>${book.discount || '0.00'} AZN</td>
                            <td>${book.authorName || 'Təyin edilməyib'}</td>
                        </tr>
                    `;
                });
            }
        } catch (e) {
            alert("Kitablar yüklənərkən xəta baş verdi!");
        }
    }

    async function searchBooks() {
        const title = document.getElementById("searchTitle").value;
        const author = document.getElementById("searchAuthor").value;
        const tbody = document.querySelector("#booksTable tbody");

        try {
            const response = await fetch(`/api/v1/books/search?title=${title}&author=${author}&page=0&size=10`, {
                headers: { 'Authorization': accessToken ? 'Bearer ' + accessToken : '' }
            });
            if (response.ok) {
                const data = await response.json();
                tbody.innerHTML = "";
                data.content.forEach(book => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${book.id}</td>
                            <td><strong>${book.title}</strong></td>
                            <td>${book.isbn}</td>
                            <td>${book.price || '0.00'} AZN</td>
                            <td>${book.discount || '0.00'} AZN</td>
                            <td>${book.authorName || 'Təyin edilməyib'}</td>
                        </tr>
                    `;
                });
            }
        } catch (e) {
            alert("Axtarış zamanı xəta baş verdi!");
        }
    }
</script>
</body>
</html>
